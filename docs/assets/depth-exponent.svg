<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480" role="img" aria-labelledby="title desc">
<title id="title">How depth exponent changes intermediate depth</title>
<desc id="desc">Curves y equals x to the power 0.8, 1, and 1.3. Exponents below one raise intermediate near-white depth; exponents above one lower it.</desc>
